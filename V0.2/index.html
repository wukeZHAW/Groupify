<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupify</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main id="groupify">

        <aside id="controls">
            <label for="csv-input">CSV-Datei mit Schülerliste importieren</label>
            <input type="file" id="csv-input" accept=".csv">

            <section id="student-list">
                <h2>Schülerliste</h2>
            </section>
            <div id="student-add">
                <input type="text" id="student-input" placeholder="Schüler hinzufügen">
                <button type="button" id="btn-add-student">Hinzufügen</button>
            </div>
            <p id="student-add-error" hidden></p>

            <button type="button" id="btn-aufteilen-einzeln">Aufteilen einzeln</button>
            <button type="button" id="btn-alle-aufteilen">Alle aufteilen</button>
        </aside>

        <section id="group-config">
            <label>
                <input type="checkbox" id="config-mode" hidden>
                <span id="config-label">Anzahl Gruppen</span>
            </label>
            <input type="number" id="config-value" min="1" value="6">
        </section>

        <section id="groups">
            <!-- Gruppenkarten werden per JavaScript erzeugt -->
        </section>

    </main>
    <script type="module" src="index.js"></script>
</body>
</html>
