<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupify</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main id="groupify">
        <h1>Groupify</h1>

        <aside id="controls">
            <p id="csv-input-label">CSV-Datei mit Schülerliste importieren</p>
            <input type="file" id="csv-input" accept=".csv" aria-labelledby="csv-input-label">

            <section id="student-list">
                <h2>Schülerliste</h2>
            </section>
            <div id="student-add">
                <input type="text" id="student-first-name" placeholder="Vorname">
                <input type="text" id="student-last-name" placeholder="Nachname">
                <button type="button" id="btn-add-student" aria-label="Hinzufügen" title="Student hinzufügen">+</button> 
            </div>

            <button type="button" id="btn-aufteilen-einzeln">Einzeln aufteilen</button>
            <button type="button" id="btn-alle-aufteilen">Alle aufteilen</button>
            <button type="button" id="btn-alle-zurueck">Alle zurück zur Schülerliste</button>
            <span title="Zuerst müssen alle Studierenden zugeteilt werden">
                <button type="button" id="btn-export" disabled>CSV exportieren</button>
            </span>
        </aside>

        <div id="main-content">
            <section id="group-config">
                <label class="config-option">
                    <span>Anzahl Gruppen</span>
                    <input type="number" id="config-value" min="1" value="6">
                </label>
                <label class="config-option">
                    <span>Gruppengrösse</span>
                    <input type="number" id="config-size" min="1" value="4">
                </label>
            </section>

            <section id="groups">
                <!-- Gruppenkarten werden per JavaScript erzeugt -->
            </section>
        </div>

    </main>
    <footer>Made by Intern Wuke (2026)</footer>
    <script type="module" src="index.js"></script>
</body>
</html>
