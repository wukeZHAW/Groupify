<!DOCTYPE html>
<html lang="de" id="top">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav id="header" class="navbar navbar-light navbar-expand-md py-0">
        <div class="container">
            <a id="logo" class="d-flex align-items-center" href="index.html">
                <span class="program-logo" aria-hidden="true">
                    <i class="bi bi-person-fill"></i>
                    <i class="bi bi-person-fill"></i>
                    <i class="bi bi-person-fill"></i>
                </span>
            </a>
            <div id="appName">
                <a class="nav-link" href="index.html">Groupify</a>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Navigation umschalten">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="index.html" aria-current="page">Gruppeneinteilung</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="information.html">Information</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="groupify" class="container flex-grow-1 py-4">
        <div class="row g-4 align-items-start">
        <aside id="controls" class="col-12 col-md-4 d-flex flex-column gap-3">
            <h1>Personen</h1>
            
            <h2>Personenliste</h2>
            <input type="file" id="csv-input" class="form-control" accept=".csv" aria-labelledby="csv-input-label">
            
            <section id="student-list" class="card shadow-sm overflow-auto p-3">
            </section>
            <div id="student-add" class="d-flex gap-2 align-items-stretch">
                <input type="text" id="student-first-name" class="form-control min-w-0 flex-grow-1" placeholder="Vorname">
                <input type="text" id="student-last-name" class="form-control min-w-0 flex-grow-1" placeholder="Nachname">
                <button type="button" id="btn-add-student" class="btn btn-success flex-shrink-0" aria-label="Hinzufügen" title="Person hinzufügen"><i class="bi bi-person-plus" aria-hidden="true"></i></button> 
            </div>

            <button type="button" id="btn-aufteilen-einzeln" class="btn btn-primary w-100" disabled><i class="bi bi-person-fill me-2" aria-hidden="true"></i>Einzelne Person zuweisen</button>
            <button type="button" id="btn-alle-aufteilen" class="btn btn-primary w-100" disabled><i class="bi bi-people-fill me-2" aria-hidden="true"></i>Alle Personen zuweisen</button>
            <button type="button" id="btn-alle-zurueck" class="btn btn-primary w-100" disabled><i class="bi bi-rewind me-2" aria-hidden="true"></i>Alle zurück zur Personenliste</button>
            
        </aside>

        <div id="main-content" class="col-12 col-md-8 d-flex flex-column gap-3 min-w-0">
            <h1>Gruppen</h1>

            <h2>Eigenschaften</h2>
            <section id="group-config">
                <label class="config-option">
                    <span>Anzahl Gruppen:</span>
                    <input type="number" id="config-value" class="form-control text-center" min="1" value="6">
                </label>
                <label class="config-option">
                    <span>Gruppengrösse:</span>
                    <input type="number" id="config-size" class="form-control text-center" min="1" value="5">
                </label>
            </section>

            <h2>Einteilung</h2>
            <div title="Zuerst müssen alle Studierenden zugeteilt werden">
                <button type="button" id="btn-export" class="btn btn-primary w-100" disabled><i class="bi bi-download me-2" aria-hidden="true"></i>Gruppen als CSV exportieren</button>
            </div>
            <section id="groups">
                <!-- Gruppenkarten werden per JavaScript erzeugt -->
            </section>
        </div>
        </div>
    </main>
    <footer>
        <div class="container py-0.5">
            <div class="row align-items-center">
                <div class="col-4">
                    <a href="https://www.zhaw.ch/de/hochschule/" target="_blank" rel="noopener noreferrer">
                        <img src="logo_footer.png" alt="ZHAW School of Engineering" width="120">
                    </a>
                </div>
                <div class="col-4 text-center">
                    <a class="text-reset text-decoration-none" href="https://www.zhaw.ch/init" target="_blank" rel="noopener noreferrer">Copyright © 2026 InIT</a>
                </div>
                <div class="col-4 text-end"> 
                    <a class="text-decoration-none" href="#top" style="color: #0064A6;">Seitenanfang <i class="bi bi-chevron-up" aria-hidden="true"></i></a>
                </div>
        
            </div>
        </div>
    </footer>

    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="student-add-error" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
            <div class="d-flex">
                <div class="toast-body" id="student-add-error-text"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Schliessen"></button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="delete-student-modal" tabindex="-1" aria-labelledby="delete-student-title" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="delete-student-title">Person löschen</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schliessen"></button>
                </div>
                <div class="modal-body" id="delete-student-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                    <button type="button" class="btn btn-danger" id="btn-confirm-delete">Löschen</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
